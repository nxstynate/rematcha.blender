<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="matchaGrad" cx="35%" cy="30%" r="78%">
      <stop offset="0%" stop-color="#d4e08a"/>
      <stop offset="30%" stop-color="#9bb84e"/>
      <stop offset="65%" stop-color="#6a8a32"/>
      <stop offset="100%" stop-color="#3d5a1e"/>
    </radialGradient>
    <radialGradient id="rimShade" cx="50%" cy="50%" r="50%">
      <stop offset="78%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.4"/>
    </radialGradient>
    <radialGradient id="specHigh" cx="32%" cy="26%" r="20%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="8"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.3"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="sphereClip">
      <circle cx="256" cy="240" r="160"/>
    </clipPath>
  </defs>

  <rect width="512" height="512" fill="none"/>

  <!-- Sphere -->
  <g filter="url(#dropShadow)">
    <circle cx="256" cy="240" r="160" fill="url(#matchaGrad)"/>
    <circle cx="256" cy="240" r="160" fill="url(#rimShade)"/>
    <circle cx="256" cy="240" r="160" fill="url(#specHigh)"/>
  </g>

  <!-- Selection band across the sphere -->
  <g clip-path="url(#sphereClip)" opacity="0.85">
    <rect x="80" y="232" width="352" height="20" fill="#f4f1e4" opacity="0.18"/>
    <line x1="80" y1="232" x2="432" y2="232" stroke="#f4f1e4" stroke-width="1.5" opacity="0.6"/>
    <line x1="80" y1="252" x2="432" y2="252" stroke="#f4f1e4" stroke-width="1.5" opacity="0.6"/>
  </g>

  <!-- Whisk strokes -->
  <g clip-path="url(#sphereClip)" stroke="#f4f1e4" fill="none"
     stroke-linecap="round" opacity="0.14">
    <path d="M 130 290 Q 256 278, 382 290" stroke-width="1.2"/>
    <path d="M 120 312 Q 256 302, 392 312" stroke-width="1.2"/>
    <path d="M 130 332 Q 256 324, 382 332" stroke-width="1.2"/>
  </g>

  <!-- Regex banner with explicit x positions to avoid renderer quirks -->
  <g>
    <rect x="126" y="406" width="260" height="52" rx="26" ry="26"
          fill="#2a2a2a" stroke="#3a5320" stroke-width="2"/>
    <!-- Hand-positioned characters: each glyph placed individually -->
    <text font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace"
          font-size="28" font-weight="700" y="442">
      <tspan x="158" fill="#9bb84e">/</tspan>
      <tspan x="180" fill="#f4f1e4">.</tspan>
      <tspan x="198" fill="#f4f1e4">*</tspan>
      <tspan x="218" fill="#f4f1e4">\</tspan>
      <tspan x="238" fill="#f4f1e4">.</tspan>
      <tspan x="256" fill="#f4f1e4">m</tspan>
      <tspan x="284" fill="#f4f1e4">a</tspan>
      <tspan x="306" fill="#f4f1e4">t</tspan>
      <tspan x="332" fill="#9bb84e">/</tspan>
    </text>
  </g>
</svg>
