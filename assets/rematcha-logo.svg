<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" fill="#282828" rx="80" ry="80"/>

  <!-- Asterisk built from 6 thick rounded rects rotated around center (256, 256). -->
  <!-- Each is 40x320, much larger to fill the tile properly. -->
  <g transform="translate(256 256)">
    <rect x="-20" y="-160" width="40" height="320" rx="20" fill="#ebdbb2"/>
    <rect x="-20" y="-160" width="40" height="320" rx="20" fill="#ebdbb2" transform="rotate(60)"/>
    <rect x="-20" y="-160" width="40" height="320" rx="20" fill="#ebdbb2" transform="rotate(120)"/>
  </g>

  <!-- Center swatch: target material color, visually anchors the asterisk hub -->
  <rect x="208" y="208" width="96" height="96" rx="8" fill="#fabd2f"/>
</svg>
